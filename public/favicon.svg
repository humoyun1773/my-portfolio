<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="2" />

  <!-- Code Bracket Left < -->
  <path d="M20 22 L13 32 L20 42" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)" />

  <!-- Code Bracket Right > -->
  <path d="M44 22 L51 32 L44 42" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)" />

  <!-- Central Stylized 'H' for Humoyun with Modern Geometry -->
  <!-- Left Stem -->
  <path d="M26 20 L26 44" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Right Stem -->
  <path d="M38 20 L38 44" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Crossbar -->
  <path d="M26 32 L38 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Top Cyber Accent Dot -->
  <circle cx="32" cy="14" r="2" fill="#06b6d4" filter="url(#glow)" />
  <!-- Bottom Cyber Accent Dot -->
  <circle cx="32" cy="50" r="2" fill="#8b5cf6" filter="url(#glow)" />
</svg>